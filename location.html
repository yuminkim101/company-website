<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오시는 길 | 클래스로(Classro)</title>
  <meta name="description" content="클래스로(Classro)의 위치를 지도로 확인하세요. 교통편은 확정되는 대로 안내합니다.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/location.css">
  <!-- 네이버 지도 (Client ID는 공개되어도 되는 값. Client Secret은 절대 넣지 않는다) -->
  <script defer src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=i7xerh0otr&amp;submodules=geocoder"></script>
  <script src="js/main.js" defer></script>
  <script defer src="js/location.js"></script>
</head>
<body>
  <site-header data-current="location"></site-header>

  <main>
    <section class="section">
      <div class="container stack">
        <p class="eyebrow">LOCATION</p>
        <h1 class="location-title">오시는 길</h1>
        <p class="section-lead">클래스로의 위치를 지도에서 확인하세요.</p>

        <div class="map-box" data-map role="region" aria-label="클래스로 위치 지도">
          <p class="map-message" data-map-message>지도를 불러오는 중입니다.</p>
        </div>
        <p class="form-hint" data-map-note>
          서울특별시 송파구 올림픽로 300
        </p>
        <a class="btn btn-outline" href="https://map.naver.com/p/search/%EC%84%9C%EC%9A%B8%ED%8A%B9%EB%B3%84%EC%8B%9C%20%EC%86%A1%ED%8C%8C%EA%B5%AC%20%EC%98%AC%EB%A6%BC%ED%94%BD%EB%A1%9C%20300" target="_blank" rel="noopener">네이버 지도에서 크게 보기 (새 창)</a>
        <!-- TODO: 확인 필요 — 이 주소는 00_회사소개.md에 없고 팀 요청으로 입력함. 팀 확정 후 js/location.js의 MAP_QUERY와 함께 갱신 -->
      </div>
    </section>

    <section class="section section-alt" aria-labelledby="route-title">
      <div class="container stack">
        <p class="eyebrow">ACCESS</p>
        <h2 class="section-title" id="route-title">주소·교통편</h2>
        <!-- TODO: 확인 필요 — 주소·지하철·버스는 팀 요청으로 입력한 내용(00_회사소개.md에 없음). 주차는 확정 전까지 자리표시자로 둔다 -->
        <dl class="fact-list reveal">
          <div class="fact-row">
            <dt class="fact-term">주소</dt>
            <dd class="fact-desc">서울특별시 송파구 올림픽로 300</dd>
          </div>
          <div class="fact-row">
            <dt class="fact-term">지하철</dt>
            <dd class="fact-desc">잠실역 2호선, 8호선</dd>
          </div>
          <div class="fact-row">
            <dt class="fact-term">버스</dt>
            <dd class="fact-desc">잠실역 1번, 11번 정류장에서 하차</dd>
          </div>
          <div class="fact-row">
            <dt class="fact-term">주차</dt>
            <dd class="fact-desc"><span class="placeholder-text">[주차 안내 확인 필요]</span></dd>
          </div>
        </dl>
      </div>
    </section>
  </main>

  <site-footer></site-footer>
</body>
</html>
