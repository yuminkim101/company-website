<!DOCTYPE html>
<html lang="ko">
<head>

  <title>오시는 길 | 클래스로(Classro)</title>
  <meta name="description" content="클래스로(Classro)의 위치를 지도로 확인하세요. 교통편은 확정되는 대로 안내합니다.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/location.css">
  <!-- 네이버 지도 (Client ID는 공개되어도 되는 값. Client Secret은 절대 넣지 않는다) -->
  <script defer src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=i7xerh0otr&amp;submodules=geocoder"></script>
  <script defer src="js/location.js"></script>

<body>
  <!-- TODO: 헤더·푸터 공통 마크업/스타일 위치가 정해지면 교체 -->
  <header class="site-header">
    <div class="container site-header-inner">
      <a class="site-logo" href="index.html">클래스로</a>
      <nav aria-label="주 메뉴">
        <ul class="site-nav">
          <li><a href="index.html">회사 소개</a></li>
          <li><a href="service.html">서비스 소개</a></li>
          <li><a href="location.html" aria-current="page">오시는 길</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container stack">
        <h1 class="section-title">오시는 길</h1>
        <p class="section-lead">클래스로의 위치를 지도에서 확인하세요.</p>

        <div class="map-box" data-map role="region" aria-label="클래스로 위치 지도">
          <p class="map-message" data-map-message>지도를 불러오는 중입니다.</p>
        </div>
        <p class="form-hint" data-map-note>
          서울특별시 송파구 올림픽로 300
        </p>
        <a class="btn btn-outline" href="https://map.naver.com/p/search/%EC%84%9C%EC%9A%B8%ED%8A%B9%EB%B3%84%EC%8B%9C%20%EC%86%A1%ED%8C%8C%EA%B5%AC%20%EC%98%AC%EB%A6%BC%ED%94%BD%EB%A1%9C%20300" target="_blank" rel="noopener">네이버 지도에서 크게 보기 (새 창)</a>
        <!-- TODO: 확인 필요 — 이 주소는 00_회사소개.md에 없고 팀 요청으로 입력함. 팀 확정 후 js/location.js의 MAP_QUERY와 함께 갱신 -->
      </div>
    </section>

    <section class="section section-alt">
      <div class="container stack">
        <h2 class="section-title">주소·교통편</h2>
        <!-- TODO: 확인 필요 — 주소 외 항목은 문서에 없는 정보이므로 확정 전까지 자리표시자로 둔다 -->
        <ul class="auto-grid info-list">
          <li class="card">
            <h3 class="card-title">주소</h3>
            <p class="card-text">서울특별시 송파구 올림픽로 300</p>
          </li>
          <li class="card">
            <h3 class="card-title">지하철</h3>
            <p class="card-text"><span class="placeholder-text">[교통편 확인 필요]</span></p>
          </li>
          <li class="card">
            <h3 class="card-title">버스</h3>
            <p class="card-text"><span class="placeholder-text">[교통편 확인 필요]</span></p>
          </li>
          <li class="card">
            <h3 class="card-title">주차</h3>
            <p class="card-text"><span class="placeholder-text">[주차 안내 확인 필요]</span></p>
          </li>
        </ul>
      </div>
    </section>

  <footer class="site-footer">
    <div class="container">
      <p class="site-footer-name">클래스로(Classro)</p>
      <p class="site-footer-note">이 사이트는 수업용 가상 회사 소개 페이지입니다.</p>
    </div>
  </footer>

</html>
